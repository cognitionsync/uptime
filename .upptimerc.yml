# CognitionSync status monitoring, powered by Upptime.
#
# Checks run on GitHub Actions every 5 minutes. Do NOT edit anything in
# .github/workflows/ directly; those files are regenerated from this config.

owner: cognitionsync
repo: uptime

# Downtime opens a GitHub issue. Assigning it means it reaches a person.
assignees:
  - akifejaz

sites:
  - name: CognitionSync
    url: https://cognitionsync.com

  # The apex is canonical and www must keep redirecting to it. If this ever
  # stops returning 301, the search consolidation breaks silently, so it is
  # worth an explicit check rather than assuming.
  - name: CognitionSync (www redirect)
    url: https://www.cognitionsync.com
    expectedStatusCodes:
      - 301

  - name: AxiomSquare
    url: https://axiomsquare.cognitionsync.com

  - name: AxiomSquare Guides
    url: https://axiomsquare.cognitionsync.com/guides/

  - name: PraTax
    url: https://pra.axiomsquare.cognitionsync.com

  - name: BuildingMall
    url: https://buildingmall.cognitionsync.com

  # A real application route rather than the shell, so this fails if the
  # backend stops answering even while nginx still serves a page.
  - name: BuildingMall Materials
    url: https://buildingmall.cognitionsync.com/materials

  - name: CognitionSync Labs
    url: https://demos.cognitionsync.com

  - name: DocuMind
    url: https://documind.cognitionsync.com

status-website:
  # GitHub Pages already serves this repo at cognitionsync.github.io/uptime.
  # To use a custom domain instead: remove baseUrl, set
  #   cname: status.cognitionsync.com
  # and add a DNS CNAME for `status` pointing to cognitionsync.github.io
  baseUrl: /uptime
  logoUrl: https://cognitionsync.com/favicon.svg
  name: CognitionSync Status
  introTitle: "**CognitionSync** service status"
  introMessage: Live availability and response times for cognitionsync.com and every product we run. Checks run every five minutes from GitHub Actions, independently of our own servers, so this page stays up even when they do not.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://cognitionsync.com
    - title: GitHub
      href: https://github.com/cognitionsync
