# CognitionSync status monitoring, powered by Upptime.
#
# Checks run on GitHub Actions every 5 minutes. Do NOT edit anything in
# .github/workflows/ directly; those files are regenerated from this config.

owner: cognitionsync
repo: uptime

# Fallback owner. Each site below sets its own assignee, so this only applies
# if a new site is added without one.
assignees:
  - akifejaz

sites:
  # ===========================================================================
  # Live applications
  #
  # Every entry points at a route the application itself renders.
  #
  # Do NOT monitor /health. Every vhost answers it with a static 200 from nginx
  # rather than from the app behind it, so a /health monitor stays green through
  # a total application outage.
  # ===========================================================================

  - name: CognitionSync
    url: https://cognitionsync.com
    assignees:
      - akifejaz

  # AxiomSquare and PraTax moved to their own apex domain. These monitor the
  # canonical hosts, not the old cognitionsync.com subdomains, because those
  # only issue a 301 and a check against them reports on the redirect rather
  # than on the application. The old names are still checked further down.
  - name: AxiomSquare
    url: https://axiomsquarepk.com
    assignees:
      - asifejjaz

  - name: AxiomSquare Guides
    url: https://axiomsquarepk.com/guides/
    assignees:
      - asifejjaz

  - name: AxiomSquare Tools
    url: https://axiomsquarepk.com/tools/
    assignees:
      - asifejjaz

  # The front end is a static bundle, so every page keeps returning 200 even if
  # the API container has stopped. This checks the API separately.
  #
  # 404 is the healthy result: an unrouted /api/ path is answered by the backend
  # itself with a JSON body, which proves the process is alive and routing. If
  # the backend dies, nginx answers with 502 instead and this goes red.
  - name: AxiomSquare API
    url: https://axiomsquarepk.com/api/
    expectedStatusCodes:
      - 404
    assignees:
      - asifejjaz

  - name: PraTax
    url: https://pra.axiomsquarepk.com
    assignees:
      - asifejjaz

  # Same reasoning as the AxiomSquare API check above.
  - name: PraTax API
    url: https://pra.axiomsquarepk.com/api/
    expectedStatusCodes:
      - 404
    assignees:
      - asifejjaz

  - name: BuildingMall
    url: https://buildingmall.cognitionsync.com
    assignees:
      - asifejjaz

  # A real application route rather than the shell, so this fails if the
  # backend stops answering even while nginx still serves a page.
  - name: BuildingMall Materials
    url: https://buildingmall.cognitionsync.com/materials
    assignees:
      - asifejjaz

  - name: CognitionSync Labs
    url: https://demos.cognitionsync.com
    assignees:
      - asifejjaz

  # Separate applications that happen to be served under paths on the demos
  # host. Each runs its own process, so the demos index being up says nothing
  # about whether these are.
  - name: Quarlux Portfolio
    url: https://demos.cognitionsync.com/quarlux/
    assignees:
      - asifejjaz

  - name: DocuMind Landing
    url: https://demos.cognitionsync.com/documind/
    assignees:
      - asifejjaz

  - name: Quarlux Power Control
    url: https://quarlux-ai.cognitionsync.com
    assignees:
      - asifejjaz

  - name: DocuMind
    url: https://documind.cognitionsync.com
    assignees:
      - asifejjaz

  - name: csfunnel
    url: https://csfunnel.cognitionsync.com
    assignees:
      - akifejaz

  - name: RISC-V Jobs
    url: https://allriscvjobs.cognitionsync.com
    assignees:
      - akifejaz

  # The listing route, which has to reach the job data to render. The home page
  # alone would still come up if that stopped working.
  - name: RISC-V Jobs Listings
    url: https://allriscvjobs.cognitionsync.com/jobs
    assignees:
      - akifejaz

  # ===========================================================================
  # Redirect-only hostnames
  #
  # These serve no application. nginx answers them itself with a 301. They are
  # worth checking because each holds its own certificate: if one stops
  # renewing, visitors hit a TLS error before the redirect can ever fire.
  #
  # Upptime follows redirects, so what these record is the status after the hop.
  # That confirms the hostname still resolves, still presents a valid
  # certificate, and still lands somewhere that works. It does NOT verify the
  # response is specifically a 301; expecting 301 here would always fail,
  # because the final status is what gets recorded.
  # ===========================================================================

  - name: CognitionSync (www)
    url: https://www.cognitionsync.com
    assignees:
      - akifejaz

  - name: AxiomSquare (www)
    url: https://www.axiomsquarepk.com
    assignees:
      - asifejjaz

  - name: AxiomSquare (old subdomain)
    url: https://axiomsquare.cognitionsync.com
    assignees:
      - asifejjaz

  - name: PraTax (old subdomain)
    url: https://pra.axiomsquare.cognitionsync.com
    assignees:
      - asifejjaz

  # ===========================================================================
  # Not a CognitionSync property, monitored alongside them
  # ===========================================================================

  - name: Akif Ejaz
    url: https://akifejaz.dev
    assignees:
      - akifejaz

status-website:
  # Served at https://status.cognitionsync.com from the gh-pages branch.
  #
  # `cname` makes the site build write a CNAME file into the deploy output on
  # every run. It has to stay here: the deploy step publishes with
  # keep_files disabled, so any CNAME added by hand through the GitHub Pages
  # settings UI gets deleted on the next build and the custom domain drops.
  #
  # There is deliberately no baseUrl. The site is served from the domain root,
  # so a baseUrl of /uptime would point every asset and link at a path that
  # does not exist and the page would come up blank.
  cname: status.cognitionsync.com
  logoUrl: https://cognitionsync.com/favicon.svg
  name: CognitionSync Status
  introTitle: "**CognitionSync** service status"
  introMessage: Live availability and response times for cognitionsync.com and every product we run. Checks run every five minutes from GitHub Actions, independently of our own servers, so this page stays up even when they do not.
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://cognitionsync.com
    - title: GitHub
      href: https://github.com/cognitionsync
